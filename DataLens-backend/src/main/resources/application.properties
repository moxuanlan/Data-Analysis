server.address=127.0.0.1
server.port=8088
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/datalens?characterEncoding=UTF-8&connectionTimeZone=UTC
spring.datasource.username=${DATALENS_DB_USERNAME}
spring.datasource.password=${DATALENS_DB_PASSWORD}
spring.sql.init.mode=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
spring.web.resources.static-locations=file:../
