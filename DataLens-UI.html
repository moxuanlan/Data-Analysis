<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataLens · 从数据到洞察</title><style>
*{box-sizing:border-box}body{margin:0;color:#15223b;background:#f8faff;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce4f1;background:white;color:#4d607b;border-radius:8px;padding:9px 15px;transition:background .2s,transform .2s}button:hover{background:#edf3ff;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:default;transform:none}.primary{background:#165dff;color:white;border-color:#165dff;box-shadow:0 5px 15px #165dff20}.primary:hover{background:#104bd1}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #83afff;outline-offset:3px}header{height:76px;padding:0 4vw;display:flex;align-items:center;gap:45px;border-bottom:1px solid #e6edf6;background:#ffffffdd}.brand{font-size:24px;font-weight:750;letter-spacing:-1px;color:#133057}.brand b{color:#165dff}nav{display:flex;gap:10px}nav button{border:0;background:none}header .primary{margin-left:auto}.badge{font-size:11px;letter-spacing:.1em;color:#6681a5}.hero{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);align-items:center;gap:28px;max-width:1600px;margin:auto;padding:70px 4vw 60px;background:radial-gradient(ellipse at 80% 55%,#e9f1ff,transparent 65%)}h1{font-size:clamp(34px,3.5vw,56px);line-height:1.3;letter-spacing:-2px;margin:22px 0}h1 span{color:#165dff}.intro p{color:#72819a;max-width:360px;line-height:1.9}.intro .primary{margin-top:22px;padding:14px 25px;font-weight:600}.trust{display:flex;gap:25px;margin-top:50px;font-size:12px;color:#687b99}.shell{display:grid;grid-template-columns:170px minmax(0,1fr) 240px;background:white;border:1px solid #dde6f3;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #284e8a12;transition:grid-template-columns .4s}.sidebar{padding:22px 13px;background:#f8faff;border-right:1px solid #e6edf6}.sidebar .brand{font-size:19px;margin:0 8px 30px}.sidebtn{display:block;width:100%;text-align:left;border:0;background:none;margin:7px 0;font-size:12px;padding:11px}.sidebtn.active{background:#e8f0ff;color:#165dff}.sidefoot{margin:45px 10px;color:#8290a7;font-size:11px}.content{min-width:0;padding:22px}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}.toolbar h2{font-size:18px;margin:0}.toolbar button{margin-left:auto;font-size:11px}.muted{color:#8090a7;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.metric{padding:15px;border:1px solid #e6edf6;border-radius:10px}.metric strong{display:block;font-size:24px;font-weight:600;color:#203d6a;margin-top:4px}.panel{border:1px solid #e4ebf5;border-radius:12px;padding:19px;margin-top:15px;background:white}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panelhead h3{margin:0;font-size:14px}.panelhead button{font-size:11px;padding:5px 10px}canvas{width:100%;height:180px;display:block}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px}th{text-align:left;background:#f7f9fd;color:#74849d;font-weight:500}th,td{padding:11px 10px;border-bottom:1px solid #eef2f7}.ai{padding:23px 18px;border-left:1px solid #e6edf6;background:#fbfcff;min-width:0;overflow:hidden}.ai h3{font-size:14px;margin:0 0 22px}.bubble{background:#edf3ff;padding:14px;border-radius:12px;font-size:12px;color:#3f5880;margin:15px 0;line-height:1.8}.ai textarea{width:100%;height:75px;border:1px solid #dce5f2;border-radius:9px;padding:10px;resize:vertical;margin-top:20px}.ai button{font-size:11px}.ai-off{grid-template-columns:170px minmax(0,1fr) 0}.ai-off .ai{padding:0;border:0;visibility:hidden}.flow{max-width:1500px;margin:0 auto;padding:0 4vw 45px}.flow h2{font-size:21px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.step{padding:22px;text-align:left;border-radius:12px}.step b{display:block;color:#25436f;font-size:15px}.step small{color:#8592a7}.step span{display:inline-block;color:#165dff;margin-bottom:15px}.workspace{padding:24px;max-width:1700px;margin:auto}.workspace .shell{min-height:calc(100dvh - 125px)}.workspace .content{padding:28px}.workspace canvas{height:280px}.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 25px}.stepbar button{font-size:12px}.stepbar .active{background:#165dff;color:white}.importgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.importbox{padding:28px;border:1px solid #dce6f6;border-radius:13px;min-height:190px;background:#fafcff}.importbox h3{margin:0 0 8px}.importbox p{color:#8291a6;font-size:12px}input,select,textarea{border:1px solid #d7e2f1;border-radius:7px;background:white;color:#263f65;padding:10px;max-width:100%}.importbox input{width:100%;margin:12px 0}progress{width:100%;height:9px;accent-color:#165dff;margin:20px 0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.rule{display:flex;align-items:center;gap:12px;padding:20px 5px;border-bottom:1px solid #edf1f7}.rule input{accent-color:#165dff}.rule small{margin-left:auto;color:#8795aa}pre{padding:22px;background:#f4f7fc;color:#2854a1;overflow:auto;border-radius:10px;font:13px/1.9 Consolas,monospace}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#173663;color:white;padding:13px 25px;border-radius:10px;z-index:20;box-shadow:0 8px 30px #0002}.expanded{position:fixed;inset:7vh 7vw;z-index:10;box-shadow:0 0 0 100vmax #17335655;overflow:auto}.expanded canvas{height:65vh!important}.demo{font-size:11px;color:#7790b4}.hero,.workspace{animation:arrive .65s both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}[hidden]{display:none!important}@media(max-width:1100px){.hero{grid-template-columns:1fr;padding-top:35px}.intro{max-width:650px}.intro h1{font-size:42px}.trust{margin-top:20px}.shell{grid-template-columns:145px minmax(0,1fr) 200px}.ai-off{grid-template-columns:145px minmax(0,1fr) 0}.steps{gap:8px}.step{padding:14px}}@media(max-width:720px){header{padding:0 20px;height:65px;gap:10px}nav{display:none}.hero{padding:30px 18px}.shell,.ai-off{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding:8px;border-right:0}.sidebar .brand,.sidefoot{display:none}.sidebtn{white-space:nowrap;width:auto;margin:0}.ai{border-left:0;border-top:1px solid #eee}.ai-off .ai{display:none}.metrics{gap:5px}.metric{padding:9px}.metric strong{font-size:19px}.content,.workspace .content{padding:15px}.steps{grid-template-columns:1fr 1fr}.workspace{padding:10px}.importgrid{grid-template-columns:1fr}.hero h1{font-size:37px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><div class="brand"><b>▥</b> DataLens</div><nav><button data-home="capability">产品能力</button><button data-home="flow">工作流程</button><button id="example">分析示例</button></nav><span class="demo">交互原型 · 演示数据</span><button class="primary" id="enter">进入工作台 →</button></header><section id="landing"><div class="hero"><div class="intro"><span class="badge">DATA INTO DECISIONS</span><h1>让数据，<br>成为决策的<span>依据。</span></h1><p>从数据导入、清洗到 SQL 与可视化。让每一次探索，都有清晰的起点和可追溯的结果。</p><button class="primary" id="start">进入工作台 →</button><div class="trust"><span>更快上手</span><span>清晰可控</span><span>团队协同</span></div></div><div id="preview"></div></div><div class="flow" id="flow"><h2>五步完成一次数据分析</h2><div class="steps"></div></div></section><section class="workspace" id="work" hidden></section><div class="toast" role="status" hidden></div><script>
const $=s=>document.querySelector(s);const names=['导入数据','数据预览','确认清洗','SQL 脚本','可视化'];const notes=['网页采集 / 本地文件','检查字段与样例','逐项确认处理建议','生成并导出脚本','探索趋势与关联'];let stage=0,clean=false,busy=false,timer=null,aiOpen=true;const rows=[['2026-01','杭州',8.2,62],['2026-02','杭州',10.1,78],['2026-03','杭州',15.4,110],['2026-04','杭州',21.2,95],['2026-05','杭州',25.6,130],['2026-06','杭州',29.1,180]];
function table(){return '<div class="tablewrap"><table><thead><tr><th>月份</th><th>城市</th><th>平均气温 °C</th><th>降水量 mm</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function chartPanel(){return '<div class="panel chartpanel"><div class="panelhead"><h3>气温与降水趋势</h3><button data-expand>展开图表</button></div><canvas aria-label="杭州一至六月气温逐渐升高的演示图表" role="img"></canvas><div class="muted">1 月 — 6 月 · 蓝线：平均气温 · 浅蓝柱：降水量</div></div>'}
function dashboard(){return '<div class="metrics"><div class="metric"><span class="muted">平均气温</span><strong>18.3 °C</strong></div><div class="metric"><span class="muted">演示记录</span><strong>6 行</strong></div><div class="metric"><span class="muted">字段数量</span><strong>4 列</strong></div></div>'+chartPanel()+'<div class="panel"><div class="panelhead"><h3>天气数据 · 样例</h3><span class="demo">固定演示数据</span></div>'+table()+'</div>'}
function shell(inner,preview=false){return '<div class="shell '+(!aiOpen?'ai-off':'')+'"><aside class="sidebar"><div class="brand">DataLens</div>'+names.map((n,i)=>'<button class="sidebtn '+(!preview&&stage===i?'active':'')+'" data-stage="'+i+'">'+String(i+1).padStart(2,'0')+'　'+n+'</button>').join('')+'<div class="sidefoot">个人演示空间<br>所有数据仅用于预览<br><br><button data-back>返回首页</button></div></aside><div class="content"><div class="toolbar"><h2>'+(preview?'天气数据分析':names[stage])+'</h2><button data-ai>'+ (aiOpen?'收起 AI':'展开 AI')+'</button></div>'+inner+'</div><aside class="ai"><h3>AI 智能助手</h3><div class="bubble">'+(preview?'探索天气变化，了解气温与降水的关系。':notes[stage]+'。我会协助你完成当前步骤。')+'</div><p class="muted">这里展示预设建议，不连接真实模型。</p><div class="bubble" id="answer">建议先确认字段类型与缺失值，再进行分析。</div><textarea aria-label="向 AI 提问" placeholder="输入你的分析问题…"></textarea><button data-ask>发送问题</button></aside></div>'}
function draw(){document.querySelectorAll('canvas').forEach(c=>{const w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;let ctx=c.getContext('2d');ctx.scale(d,d);let begin=performance.now();function frame(now){let p=matchMedia('(prefers-reduced-motion: reduce)').matches?1:Math.min((now-begin)/650,1);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e8eef8';ctx.fillStyle='#8b9ab0';ctx.font='10px sans-serif';for(let j=0;j<4;j++){let y=20+j*(h-45)/3;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-12,y);ctx.stroke();ctx.fillText(30-j*10,2,y+3)}rows.forEach((r,i)=>{let x=40+i*(w-60)/5;ctx.fillStyle='#d7e7ff';ctx.fillRect(x-8,h-25-r[3]/200*(h-40)*p,16,r[3]/200*(h-40)*p);ctx.fillStyle='#8190a8';ctx.fillText((i+1)+'月',x-7,h-7)});ctx.strokeStyle='#165dff';ctx.lineWidth=2.4;ctx.beginPath();rows.forEach((r,i)=>{let x=40+i*(w-60)/5,y=h-25-r[2]/32*(h-45)*p;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();if(p<1&&c.isConnected)requestAnimationFrame(frame)}requestAnimationFrame(frame)})}
function toast(t){$('.toast').textContent=t;$('.toast').hidden=false;setTimeout(()=>$('.toast').hidden=true,3000)}
function home(){if(timer)clearInterval(timer);busy=false;$('#landing').hidden=false;$('#work').hidden=true;$('#enter').textContent='进入工作台 →';$('#preview').innerHTML=shell(dashboard(),true);draw()}
function enter(i=0){stage=i;$('#landing').hidden=true;$('#work').hidden=false;$('#enter').textContent='返回首页';render()}
function sql(){const kind=$('#sqltype')?.value||'create';if(kind==='select')return 'SELECT month, AVG(temperature) AS avg_temp\nFROM weather_demo\nGROUP BY month\nORDER BY month;';if(kind==='insert')return rows.map(r=>"INSERT INTO weather_demo VALUES ('"+r[0]+"', '"+r[1]+"', "+r[2]+", "+r[3]+");").join('\n');if(kind==='update')return "UPDATE weather_demo\nSET temperature = 8.2\nWHERE month = '2026-01' AND city = '杭州';";return 'CREATE TABLE weather_demo (\n  month CHAR(7) NOT NULL,\n  city VARCHAR(50) NOT NULL,\n  temperature DECIMAL(5,2),\n  rainfall DECIMAL(7,2)\n);'}
function render(){let inner='<div class="stepbar">'+names.map((n,i)=>'<button data-stage="'+i+'" class="'+(stage===i?'active':'')+'">'+(i+1)+' '+n+'</button>').join('')+'</div>';if(stage===0)inner+='<p class="muted">选择数据来源，体验模拟导入。文件内容不会读取或上传，网址不会被请求。</p><div class="importgrid"><div class="importbox"><h3>网页采集</h3><p>输入目标网站，模拟批量采集过程。</p><input id="url" type="url" placeholder="https://example.com/weather" aria-label="采集网址"><button class="primary" data-import="crawl">模拟采集</button></div><div class="importbox"><h3>上传文件</h3><p>CSV / Excel · 仅显示文件名</p><input type="file" id="file" accept=".csv,.xlsx" aria-label="选择数据文件"><button class="primary" data-import="file">模拟导入</button></div></div><div class="panel"><span id="progresslabel" role="status">也可以直接使用内置天气样例。</span><progress value="0" max="100"></progress><button data-import="sample">载入演示数据</button></div>';if(stage===1)inner+='<p class="muted">当前展示内置天气样例，不是网站或文件的实际数据。</p>'+table()+'<div class="actions"><button class="primary" data-stage="2">下一步：确认清洗 →</button></div>';if(stage===2)inner+='<p class="muted">勾选规则并确认，体验清洗交互；样例没有异常值，不实际修改数据。</p>'+['移除重复记录','补齐缺失值','统一日期格式','标记异常数值'].map((n,i)=>'<label class="rule"><input type="checkbox" checked> '+n+'<small>演示建议 · 影响 0 行</small></label>').join('')+'<div id="cleanstatus" role="status">'+(clean?'已确认清洗规则':'等待用户确认')+'</div><div class="actions"><button id="clean" class="primary">确认所选规则</button><button data-stage="3" '+(!clean?'disabled':'')+'>下一步：SQL →</button></div>';if(stage===3)inner+='<p class="muted">基于演示数据生成 SQL，可下载供查看；未连接数据库。</p><select id="sqltype" aria-label="SQL 类型"><option value="create">CREATE TABLE · 建表</option><option value="insert">INSERT · 导入</option><option value="select">SELECT · 查询</option><option value="update">UPDATE · 更新</option></select><pre id="sqlcode"></pre><div class="actions"><button id="download">导出 .sql</button><button class="primary" data-stage="4">下一步：可视化 →</button></div>';if(stage===4)inner+='<div class="muted">内置天气样例 · 推荐 ECharts，用于时间趋势与指标比较。</div>'+dashboard()+'<div class="actions"><button data-stage="0">开始新分析</button></div>';$('#work').innerHTML=shell(inner);if(stage===3)$('#sqlcode').textContent=sql();draw()}
$('.steps').innerHTML=names.map((n,i)=>'<button class="step" data-stage="'+i+'"><span>0'+(i+1)+'</span><b>'+n+'</b><small>'+notes[i]+'</small></button>').join('');$('#start').onclick=()=>enter();$('#enter').onclick=()=>$('#landing').hidden?home():enter();$('#example').onclick=()=>enter(4);
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.stage!==undefined){if(busy){toast('请等待模拟导入结束');return}enter(+b.dataset.stage)}if(b.hasAttribute('data-back'))home();if(b.dataset.home){home();(b.dataset.home==='flow'?$('#flow'):$('.hero')).scrollIntoView({behavior:'smooth'})}if(b.hasAttribute('data-ai')){aiOpen=!aiOpen;document.querySelectorAll('.shell').forEach(s=>s.classList.toggle('ai-off',!aiOpen));document.querySelectorAll('[data-ai]').forEach(x=>x.textContent=aiOpen?'收起 AI':'展开 AI');setTimeout(draw,420)}if(b.hasAttribute('data-ask')){const a=b.closest('.ai'),t=a.querySelector('textarea');if(!t.value.trim()){t.focus();return}a.querySelector('#answer').textContent='演示回复：建议按月份查看气温趋势，并比较降水量。此回复为预设内容。';t.value=''}if(b.hasAttribute('data-expand')){let p=b.closest('.panel');p.classList.toggle('expanded');b.textContent=p.classList.contains('expanded')?'收起图表':'展开图表';draw()}if(b.dataset.import){if(busy)return;if(b.dataset.import==='crawl'){let u=$('#url');try{if(!['http:','https:'].includes(new URL(u.value).protocol))throw 0}catch{toast('请输入有效的 http 或 https 网址');u.focus();return}}if(b.dataset.import==='file'&&!$('#file').files.length){toast('请先选择 CSV 或 Excel 文件');return}busy=true;document.querySelectorAll('[data-import]').forEach(x=>x.disabled=true);let n=0;timer=setInterval(()=>{n+=10;$('progress').value=n;$('#progresslabel').textContent='模拟导入中… '+n+'%';if(n>=100){clearInterval(timer);busy=false;enter(1);toast('演示数据已就绪 · 6 行 / 4 列')}},120)}if(b.id==='clean'){clean=true;render();toast('已确认清洗规则，样例数据未改变')}if(b.id==='download'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['-- DataLens demo only\n'+sql()],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='DataLens-demo.sql';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示 SQL')}});document.addEventListener('change',e=>{if(e.target.id==='sqltype')$('#sqlcode').textContent=sql()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.expanded').forEach(p=>{p.classList.remove('expanded');p.querySelector('[data-expand]').textContent='展开图表'});draw()}});window.addEventListener('resize',draw);home();
</script></html>
